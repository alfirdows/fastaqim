/* ---------- track builder ---------- */
function build(){const g=G;
 while(g.next<g.dist+FAR){const z=g.next;
  if(g.finishZ!=null&&z>g.finishZ-6){g.next=z+6;continue}
  if(g.gates.some(q=>Math.abs(q-z)<6)){g.next=z+4;continue}
  const early=g.dist<25,dk=g.mode==='dhikr',r=Math.random();
  const sp2=dk?1.7:1.15,coinLine=(ln,z0,n,arc)=>{for(let k=0;k<n;k++)g.objs.push({k:'coin',ln,z:z0+k*sp2,h:arc?Math.sin(k/(n-1)*Math.PI)*1.6+.1:0})};
  if(early||r<(dk?.5:.36)){const n=dk?7:8;coinLine(Math.floor(Math.random()*3),z,n,false);g.next=z+n*sp2+rnd(2,4);continue}
  const free=Math.floor(Math.random()*3);
  if(r<.58){const ln=pick([0,1,2]);g.objs.push({k:'low',ln,z});coinLine(ln,z-2.4,5,true);if(Math.random()<.4)g.objs.push({k:'low',ln:(ln+1)%3,z})}
  else if(r<.76){const ln=pick([0,1,2]);g.objs.push({k:'high',ln,z});coinLine(ln,z-2,4,false)}
  else{const bl=[0,1,2].filter(v=>v!==free);(Math.random()<.5?bl.slice(0,1):bl).forEach(b=>g.objs.push({k:'block',ln:b,z}));coinLine(free,z-3,5,false)}
  coinLine(free,z+2,dk?4:5,false);
  if(z>g.bnNext&&Math.random()<.5){g.objs.push({k:Math.random()<.35?'gem':'star5',ln:free,z:z+3.5,h:Math.random()<.4?1.2:.3});g.bnNext=z+rnd(18,34)}
  if(z>g.pwNext){g.objs.push({k:pick(['mag','shield','x2','boost']),ln:free,z:z+5,h:.7});g.pwNext=z+rnd(70,110)}
  g.next=z+rnd(9,13)*(g.speed<9?1.15:1)}
}

 br_t:["Time for one real task","حان وقت مهمة حقيقية","Yeroon hojii dhugaa tokkoo ga'eera","Waa waqtigii hal hawl dhab ah"],
 br_p:["You played 15 minutes. Tick one task in your To-do, then come back and keep playing.","لعبت ١٥ دقيقة. أنجز مهمة واحدة في قائمة المهام، ثم ارجع وأكمل اللعب.","Daqiiqaa 15 taphatte. Hojii tokko xumuriitii deebi'ii itti fufi.","15 daqiiqo ayaad ciyaartay. Hal hawl dhammee, kadib soo noqo oo sii wad."],
 br_go:["Open my To-do","افتح قائمة المهام","Tarree hojii koo bani","Fur liiskayga hawlaha"],
 br_did:["I did a task ✓","أنجزت مهمة ✓","Hojii tokko xumureera ✓","Hawl ayaan dhammeeyay ✓"],
 br_not:["Tick a task in your To-do first","أنجز مهمة في قائمة المهام أولًا","Dura hojii tokko xumuri","Marka hore hawl dhammee"],
 br_ok:["Great work! Play on 🎉","عمل رائع! أكمل اللعب 🎉","Hojii gaarii! Itti fufi 🎉","Shaqo fiican! Sii ciyaar 🎉"],
 br_w5:["5 min until your task break","٥ دقائق حتى استراحة المهمة","Daqiiqaa 5 boqonnaa hojiitti","5 daqiiqo ilaa nasashada hawsha"],
 br_w1:["1 min until your task break","دقيقة حتى استراحة المهمة","Daqiiqaa 1 boqonnaa hojiitti","1 daqiiqo ilaa nasashada hawsha"],
 fq_w5:["5 min of free play left","باقي ٥ دقائق من اللعب الحر","Tapha bilisaa daqiiqaan 5 hafte","5 daqiiqo oo ciyaar xor ah ayaa hadhay"],
 fq_w1:["1 min of free play left","باقي دقيقة من اللعب الحر","Tapha bilisaa daqiiqaan 1 hafte","1 daqiiqo oo ciyaar xor ah ayaa hadhay"],
 rule:["Every 15 min of play: 1 real task","كل ١٥ دقيقة لعب: مهمة حقيقية واحدة","Daqiiqaa 15 taphaa hundaaf: hojii dhugaa 1","15 daqiiqo oo ciyaar ah kasta: 1 hawl dhab ah"],
 rule_n:["Task break in {n} min","استراحة المهمة بعد {n} د","Boqonnaan hojii daqiiqaa {n} booda","Nasashada hawsha {n} daqiiqo kadib"]});
const BRK='fastaqim.gbreak',BR_MAX=900;
function brGet(){try{return Object.assign({s:0,at:Date.now()},JSON.parse(localStorage.getItem(BRK)||'{}'))}catch(e){return {s:0,at:Date.now()}}}
function brSet(o){try{localStorage.setItem(BRK,JSON.stringify(o))}catch(e){}}
function brTaskSince(t){try{const S=JSON.parse(localStorage.getItem('launchpad.v1')||'{}');return (S.tasks||[]).some(k=>k.done&&k.doneAt&&k.doneAt>t)}catch(e){return false}}
let BR=brGet();if(brTaskSince(BR.at)){BR={s:0,at:Date.now()};brSet(BR)}
function brCard(){state='end';try{navigator.vibrate&&navigator.vibrate([20,50,20])}catch(e){}const since=BR.at;
 menuShow(`<p class="big" style="font-size:2.6rem;margin:0">✅</p><h1>${tl('br_t')}</h1><p style="margin:6px 0 10px">${tl('br_p')}</p>
  <a class="go" id="brGo" href="./#todo" style="text-align:center;line-height:56px;text-decoration:none">${tl('br_go')}</a><button class="sec" id="brDid">${tl('br_did')}</button>`);
 $('pz').hidden=true;
 $('brDid').onclick=()=>{if(brTaskSince(since)){BR={s:0,at:Date.now()};brSet(BR);toast(tl('br_ok'));menuHide();showMenu()}else toast(tl('br_not'))}}
{const _s=step;step=function(dt){const r=_s.apply(this,arguments);try{if(state==='play'&&G&&G.cd<=0){const b0=BR.s;BR.s+=dt;
   if(b0<BR_MAX-300&&BR.s>=BR_MAX-300)toast('⏱ '+tl('br_w5'));if(b0<BR_MAX-60&&BR.s>=BR_MAX-60){toast('⏱ '+tl('br_w1'));try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
   if(Math.floor(b0)!==Math.floor(BR.s))brSet(BR);
   if(BR.s>=BR_MAX&&G.mode!=='dhikr'){brSet(BR);brCard()}
   if(G.mode==='free'&&FQ){const l=fqLeftO(FQ);if(!step.f5&&l<=300&&l>290){step.f5=1;toast('⏱ '+tl('fq_w5'))}if(!step.f1&&l<=60&&l>50){step.f1=1;toast('⏱ '+tl('fq_w1'));try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}}}}catch(e){}return r}}
/* a dhikr run is never cut in the middle: the task break shows when you try to start the next run */
{const _b=begin;begin=function(){BR=brGet();if(brTaskSince(BR.at)){BR={s:0,at:Date.now()};brSet(BR)}if(BR.s>=BR_MAX){brCard();return}step.f5=step.f1=0;return _b.apply(this,arguments)}}
function ruleLine(){try{const go=$('goB');if(go&&!$('ruleL')){const left=Math.max(0,Math.ceil((BR_MAX-BR.s)/60));const p=document.createElement('p');p.id='ruleL';p.style.cssText='font-size:.8rem;margin-top:8px;color:#475569';p.textContent='⏱ '+tl('rule_n').replace('{n}',left)+' · '+tl('rule');p.style.textAlign='center';go.before(p)}}catch(e){}}
{const _sm=showMenu;showMenu=function(){const r=_sm.apply(this,arguments);ruleLine();return r}}ruleLine();
addEventListener('pagehide',()=>brSet(BR));
</script>
