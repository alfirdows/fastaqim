name: Hisn al-Muslim timings (one clip per dhikr)
# Free and open: faster-whisper (MIT) transcribes the Hisn al-Muslim section recordings with word times,
# so the preview can play each dhikr on its own. Read-only: prints the timings to the log and keeps them as an artifact.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: [tools/hisn/**, .github/workflows/hisn-transcribe.yml]
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "faster-whisper==1.1.1" requests
      - name: Transcribe
        env:
          MODEL: large-v3
        run: python tools/hisn/transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: hisn-transcript
          path: tools/hisn/out/
