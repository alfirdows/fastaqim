name: Bead sound source (CC0 recording)
# Fetches a free CC0 field recording of real beads (Freesound #345511, "Beads Falling Onto Wood" by juliansmart,
# Creative Commons 0) and commits it to tools/beads/src so short single-bead clicks can be cut from it.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: [tools/beads/sources.txt, .github/workflows/bead-sound.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p tools/beads/src
          while read -r name url; do
            [ -z "$name" ] && continue; case "$name" in \#*) continue;; esac
            curl -fsSL -A "Mozilla/5.0" -o "tools/beads/src/$name" "$url" && echo "ok $name $(stat -c%s tools/beads/src/$name)" || echo "FAILED $name $url"
          done < tools/beads/sources.txt
          ls -la tools/beads/src
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/beads/src
          git diff --cached --quiet || (git commit -m "Bead sound source files (CC0)" && git push)
