name: Adhkar reader data (word meanings, audio, clip check)
# Free sources only: Quran.com API (word meanings), EveryAyah (Saad al-Ghamdi per-ayah audio),
# faster-whisper (MIT) to check each Hisn clip's first/last words and get word times. Commits results to the branch.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: [tools/adhkar/**, .github/workflows/adhkar-data.yml]
permissions:
  contents: write
concurrency:
  group: adhkar-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "faster-whisper==1.1.1" numpy uroman
          pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Word meanings from Quran.com
        run: python tools/adhkar/fetch_words.py
      - name: Saad al-Ghamdi ayat not yet in audio/g
        run: |
          for c in 001001 001002 001003 001004 001005 001006 001007 003173 021087; do
            [ -s audio/g/$c.mp3 ] || curl -fsSL --retry 4 -o audio/g/$c.mp3 "https://everyayah.com/data/Ghamadi_40kbps/$c.mp3"
          done
      - name: Cut clips
        run: python tools/adhkar/cut_more.py
      - name: Check every clip
        env:
          MODEL: large-v3
        run: python tools/adhkar/verify_clips.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/adhkar audio/g hisn/clips
          git diff --cached --quiet || (git commit -m "Adhkar reader data: word meanings, Ghamdi ayat, clip word times" && git pull --rebase -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME})
