name: Deploy reminders function
# Puts supabase/functions/push live on Supabase (free). Needs one repository secret:
# SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens). It is never shown in logs.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::notice::Add the SUPABASE_ACCESS_TOKEN secret, then run this again."; exit 0; fi
          supabase functions deploy push --project-ref xnxqibdjjrgjqpszvdbe --no-verify-jwt --use-api
      - name: Check
        if: ${{ env.HAS_TOKEN == 'yes' }}
        run: |
          sleep 5
          curl -s "https://xnxqibdjjrgjqpszvdbe.supabase.co/functions/v1/push?key=1" | head -c 200; echo
