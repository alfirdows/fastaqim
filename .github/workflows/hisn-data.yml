name: Hisn al-Muslim library data
# Free sources only: Islamic-Pro-azkar-API (MIT) for text, counts and per-dhikr audio; sunnah.com/hisn for references and grades.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: [tools/hisn-lib/**, .github/workflows/hisn-data.yml]
permissions:
  contents: write
concurrency:
  group: hisn-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch text, references and audio
        run: python tools/hisn-lib/fetch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/hisn hisn/a
          git diff --cached --quiet || (git commit -m "Hisn al-Muslim library data: text, references, audio" && git pull --rebase -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME})
