<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="apple-mobile-web-app-capable" content="yes"><title>Fastaqim design</title>
<link rel="stylesheet" href="v/ph-regular/style.css"><link rel="stylesheet" href="v/ph-fill/style.css"><link rel="stylesheet" href="v/ph-duotone/style.css"><link rel="stylesheet" href="v/ph-bold/style.css">
<style>
@font-face{font-family:Inter;src:url(v/fonts/inter-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:"Inter Tight";src:url(v/fonts/inter-tight-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:Readex;src:url(v/fonts/readex-pro-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Readex;src:url(v/fonts/readex-pro-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:Readex;src:url(v/fonts/readex-pro-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Readex;src:url(v/fonts/readex-pro-arabic-700-normal.woff2);font-weight:700 900}
@font-face{font-family:Hafs;src:url(v/fonts/UthmanicHafs.otf)}
:root{
 --bg:#F5F3EE;--card:#FFFFFF;--ink:#101815;--ink2:#3C4943;--mut:#7A857F;--line:rgba(16,24,21,.08);
 --em:#0E5A47;--em2:#13735B;--emL:#E3EFEA;--gold:#B8872E;--goldL:#F6ECD8;--rose:#C2493D;--roseL:#F7E4E1;
 --sh:0 1px 2px rgba(16,24,21,.04),0 8px 24px -12px rgba(16,24,21,.12);
 --f:"Inter",Readex,-apple-system,sans-serif;--fd:"Inter Tight","Inter",Readex,sans-serif}
.dark{--bg:#0A0F0D;--card:#141B18;--ink:#F1F4F2;--ink2:#C6CFCA;--mut:#87938D;--line:rgba(255,255,255,.08);--em:#3FBF93;--em2:#2FA57D;--emL:rgba(63,191,147,.14);--gold:#E2B35A;--goldL:rgba(226,179,90,.14);--rose:#F07A6E;--roseL:rgba(240,122,110,.14);--sh:0 1px 0 rgba(255,255,255,.03) inset}
html[dir=rtl]{--f:Readex,"Inter",sans-serif;--fd:Readex,"Inter",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;position:relative;font-feature-settings:"cv11","ss01","tnum"}
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 17px/1 var(--f);letter-spacing:-.01em;direction:ltr}
.sb .r{display:flex;gap:6px;align-items:center}.sb .r i{font-size:17px}
.bat{width:26px;height:12px;border:1.5px solid currentColor;border-radius:4px;opacity:.9;position:relative}.bat:after{content:"";position:absolute;inset:1.5px;width:60%;background:currentColor;border-radius:1.5px}
.scr{height:790px;overflow:hidden;padding:0 16px}
h1{font:700 32px/1.12 var(--fd);letter-spacing:-.025em}
.sub{font:500 14px/1.4 var(--f);color:var(--mut);margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 4px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--card);box-shadow:var(--sh);font:600 14px var(--f);color:var(--ink)}
.chip i{font-size:17px}
.av{width:38px;height:38px;border-radius:50%;background:var(--emL);color:var(--em);display:grid;place-items:center;font:700 15px var(--f)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:18px}
.k{font:600 12px var(--f);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
html[dir=rtl] .k{letter-spacing:0}
/* hero */
.hero{border-radius:28px;padding:20px;color:#fff;position:relative;overflow:hidden;
 background:radial-gradient(120% 90% at 100% 0%,#1E8A6C 0%,rgba(30,138,108,0) 55%),linear-gradient(160deg,#0F5E4A 0%,#0A3F33 100%);box-shadow:0 18px 40px -18px rgba(10,63,51,.55)}
.dark .hero{background:radial-gradient(120% 90% at 100% 0%,#1C7A60 0%,rgba(28,122,96,0) 55%),linear-gradient(160deg,#0E4B3C 0%,#08261F 100%)}
.hero .k{color:rgba(255,255,255,.7)}
.hero .nm{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
.hero .nm b{font:700 40px/1 var(--fd);letter-spacing:-.03em}
.hero .cd{font:600 15px var(--f);color:rgba(255,255,255,.8);text-align:end}
.hero .cd big{display:block;font:700 26px/1.1 var(--fd);color:#fff;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tl{display:grid;grid-template-columns:repeat(5,1fr);margin-top:22px;position:relative}
.tl:before{content:"";position:absolute;left:10%;right:10%;top:13px;height:2px;background:rgba(255,255,255,.18)}
.tl:after{content:"";position:absolute;left:10%;width:40%;top:13px;height:2px;background:rgba(255,255,255,.75)}
html[dir=rtl] .tl:after{left:auto;right:10%}
.tl div{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;font:500 12px var(--f);color:rgba(255,255,255,.7)}
.tl div b{font:600 13px var(--f);color:#fff}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#0B4A3B;border:2px solid rgba(255,255,255,.25);font-size:14px}
.dot.on{background:#fff;color:#0E5A47;border-color:#fff}
.dot.late{background:#E2B35A;color:#3A2A08;border-color:#E2B35A}
.dot.nx{border-color:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.14)}
/* rings */
.ring{--p:.6;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--em) calc(var(--p)*360deg),var(--emL) 0);display:grid;place-items:center;flex:none}
.ring:before{content:"";width:50px;height:50px;border-radius:50%;background:var(--card);grid-area:1/1}
.ring span{grid-area:1/1;font:700 16px var(--fd);letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:14px}
.st{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;font:600 13px var(--f)}
.st.on{background:var(--emL);color:var(--em)}.st.late{background:var(--goldL);color:var(--gold)}.st.miss{background:var(--roseL);color:var(--rose)}.st.no{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
.gold{color:var(--gold)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec h2{font:700 20px var(--fd);letter-spacing:-.02em}
.sec a{font:600 14px var(--f);color:var(--em)}
.list{background:var(--card);border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:56px;position:relative}
.li+.li:before{content:"";position:absolute;top:0;inset-inline-start:52px;inset-inline-end:0;height:.5px;background:var(--line)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font:600 16px/1.3 var(--f)}.li .t small{display:block;font:500 13px/1.3 var(--f);color:var(--mut);margin-top:2px}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:21px;flex:none}
.ic.e{background:var(--emL);color:var(--em)}.ic.g{background:var(--goldL);color:var(--gold)}.ic.r{background:var(--roseL);color:var(--rose)}
.chev{color:var(--mut);font-size:16px}html[dir=rtl] .chev{transform:scaleX(-1)}
.bar{height:6px;border-radius:3px;background:var(--emL);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--em)}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid rgba(122,133,127,.45);flex:none}
.ck.d{background:var(--em);border-color:var(--em);display:grid;place-items:center;color:#fff;font-size:14px}
.pri{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:1px}
/* verse */
.ar{font-family:Hafs,serif;direction:rtl;text-align:center;font-size:26px;line-height:1.95;color:var(--ink)}
/* tab bar */
.tab{position:absolute;left:14px;right:14px;bottom:26px;height:66px;border-radius:33px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px;
 background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 10px 30px -10px rgba(16,24,21,.25),inset 0 0 0 .5px rgba(16,24,21,.08)}
.dark .tab{background:rgba(30,38,35,.78);box-shadow:0 10px 30px -10px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.1)}
.tab a{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px var(--f);color:var(--mut);height:54px;justify-content:center;border-radius:27px}
.tab a i{font-size:25px}
.tab a.on{color:var(--em);background:var(--emL)}
.hb{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--ink);transform:translateX(-50%);opacity:.9}
.fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,var(--bg) 70%);pointer-events:none}
/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(118,118,128,.12);border-radius:12px;padding:3px;margin:4px 0 16px}
.seg span{text-align:center;font:600 14px/32px var(--f);color:var(--ink2);border-radius:9px}
.seg span.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.kc{display:flex;gap:6px}.kp{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 9px;border-radius:14px;font:600 12.5px var(--f);color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}.kp.y{color:var(--em);background:var(--emL);box-shadow:none}
.kb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mut)}
.kb.y{background:var(--em);color:#fff;box-shadow:none}
/* dhikr */
.tog{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
.tog span{height:30px;padding:0 12px;border-radius:15px;font:600 12.5px/30px var(--f);background:var(--card);box-shadow:var(--sh);color:var(--mut)}
.tog span.on{background:var(--emL);color:var(--em);box-shadow:none}
.counter{width:150px;height:150px;border-radius:50%;margin:16px auto 0;display:grid;place-items:center;position:relative;
 background:conic-gradient(var(--em) calc(var(--p)*360deg),var(--emL) 0);--p:.4}
.counter:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card);box-shadow:0 10px 30px -12px rgba(14,90,71,.45)}
.counter span{position:relative;text-align:center;font:700 44px/1 var(--fd);letter-spacing:-.03em}
.counter small{display:block;font:600 14px var(--f);color:var(--mut);margin-top:4px;letter-spacing:0}
.ctl{display:flex;justify-content:center;gap:12px;margin-top:16px}
.ctl span{height:40px;min-width:40px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13.5px var(--f);color:var(--ink2)}
.ctl span i{font-size:18px}
.ctl .pl{background:var(--em);color:#fff;box-shadow:none}
.prog{display:flex;gap:4px;margin:2px 4px 14px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.d{background:var(--em)}.prog i.c{background:var(--gold)}
.qa{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:0 8px 0 16px;color:var(--mut);font:500 16px var(--f);margin-bottom:6px}
.qa .pl{margin-inline-start:auto;width:36px;height:36px;border-radius:12px;background:var(--em);color:#fff;display:grid;place-items:center;font-size:20px}
.swipe{display:flex;position:relative}
.swipe .li{flex:none;width:100%;background:var(--card);transform:translateX(-132px);box-shadow:0 0 0 .5px var(--line)}
html[dir=rtl] .swipe .li{transform:translateX(132px)}
.swipe .act{position:absolute;inset-inline-end:0;top:0;bottom:0;display:flex}
.swipe .act span{width:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px var(--f);color:#fff}
.size{font:600 11.5px var(--f);padding:2px 7px;border-radius:7px;background:rgba(118,118,128,.12);color:var(--ink2);margin-inline-start:6px}
.swipe .li{transform:none!important}.swipe .act{display:none}p{text-wrap:pretty}
/* v2: motion + delight */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scr>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}.scr>*:nth-child(2){animation-delay:.04s}.scr>*:nth-child(3){animation-delay:.08s}.scr>*:nth-child(4){animation-delay:.12s}.scr>*:nth-child(5){animation-delay:.16s}.scr>*:nth-child(6){animation-delay:.2s}
body.still .scr>*{animation:none}
.ck,.counter,.tab a,.st,.chip,.kp{transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.ck:active,.counter:active{transform:scale(.92)}
.ck.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.counter{transition:--p .3s}
.counter.bump span{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
/* celebration */
.cel{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,#1B8A6A 0%,#0B3F33 60%,#06261F 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:110px 28px 40px;text-align:center;overflow:hidden}
.cel .medal{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 35% 30%,#FFE7A8,#E2B35A 45%,#9C6B16 100%);box-shadow:0 20px 50px -10px rgba(0,0,0,.5),inset 0 -6px 14px rgba(0,0,0,.25),inset 0 4px 10px rgba(255,255,255,.5);animation:medal 1s cubic-bezier(.2,1.4,.4,1) both}
.cel .medal i{font-size:72px;color:#fff;filter:drop-shadow(0 3px 4px rgba(120,80,10,.6))}
@keyframes medal{0%{transform:scale(.3) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.cel .ring2{position:absolute;inset:-22px;border-radius:50%;border:1.5px solid rgba(255,231,168,.35);animation:ripple 2.4s ease-out infinite}
.cel .ring2.b{animation-delay:1.2s}@keyframes ripple{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.5);opacity:0}}
.cel .sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFE7A8;opacity:.9}
.cel h2{font:700 34px/1.1 var(--fd);letter-spacing:-.03em;margin-top:40px}
.cel p{font:500 16px/1.5 var(--f);color:rgba(255,255,255,.78);margin-top:10px;max-width:300px}
.cel .wk{display:flex;gap:10px;margin-top:28px}
.cel .wk div{display:flex;flex-direction:column;align-items:center;gap:6px;font:600 12px var(--f);color:rgba(255,255,255,.6)}
.cel .wk span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:16px}
.cel .wk span.d{background:#E2B35A;color:#3A2A08}.cel .wk span.t{background:#fff;color:#0E5A47;box-shadow:0 0 0 5px rgba(255,255,255,.18)}
.cel .num{font:800 64px/1 var(--fd);letter-spacing:-.04em;margin-top:24px;font-variant-numeric:tabular-nums}
.cel .num small{display:block;font:600 14px var(--f);letter-spacing:.02em;color:rgba(255,255,255,.7);margin-top:4px}
.cel .btn{margin-top:auto;width:100%;height:54px;border-radius:27px;background:#fff;color:#0E5A47;font:700 17px/54px var(--f)}
.cel .src{font:500 12.5px var(--f);color:rgba(255,255,255,.55);margin-top:12px}
/* onboarding */
.onb{padding:30px 24px 0;height:790px;display:flex;flex-direction:column}
.onb .step{display:flex;gap:6px;margin-bottom:34px}.onb .step i{flex:1;height:4px;border-radius:2px;background:var(--line)}.onb .step i.d{background:var(--em)}
.onb h1{font-size:34px}.onb .lead{font:500 17px/1.5 var(--f);color:var(--ink2);margin-top:10px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--sh);margin-top:12px;font:600 16px var(--f)}
.opt small{display:block;font:500 13.5px var(--f);color:var(--mut);margin-top:2px}
.opt.on{box-shadow:inset 0 0 0 2px var(--em),var(--sh)}
.opt .rd{margin-inline-start:auto;width:24px;height:24px;border-radius:50%;border:2px solid rgba(122,133,127,.45)}
.opt.on .rd{border:7px solid var(--em)}
.cta{margin-top:auto;margin-bottom:46px;height:56px;border-radius:28px;background:var(--em);color:#fff;font:700 17px/56px var(--f);text-align:center;box-shadow:0 12px 26px -12px rgba(14,90,71,.6)}
.skip{text-align:center;font:600 15px var(--f);color:var(--mut);margin-top:-30px;margin-bottom:40px}
/* empty */
.empty{text-align:center;padding:40px 30px 0}
.empty .em{width:108px;height:108px;border-radius:32px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(160deg,var(--emL),transparent);box-shadow:inset 0 0 0 1px var(--line)}
.empty .em i{font-size:54px;color:var(--em)}
.empty h3{font:700 22px var(--fd);letter-spacing:-.02em;margin-top:22px}
.empty p{font:500 15.5px/1.5 var(--f);color:var(--mut);margin-top:8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.sugg span{height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:var(--sh);font:600 14px/36px var(--f);color:var(--ink2)}
/* upgrades */
.up{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.up .c{border-radius:18px;background:var(--card);box-shadow:var(--sh);overflow:hidden}
.up .pv{height:118px;position:relative;overflow:hidden}
.up .c b{display:block;font:700 14px var(--f);padding:10px 12px 0}
.up .c small{display:block;font:500 12px/1.35 var(--f);color:var(--mut);padding:2px 12px 0}
.up .c .bt{margin:10px 12px 12px;height:34px;border-radius:17px;font:700 13px/34px var(--f);text-align:center}
.bt.f{background:var(--emL);color:var(--em)}.bt.p{background:var(--ink);color:var(--bg)}
.tag{position:absolute;top:8px;inset-inline-start:8px;height:22px;padding:0 8px;border-radius:11px;font:700 11px/22px var(--f);background:rgba(255,255,255,.9);color:#0E5A47}
.tag.p{background:#E2B35A;color:#3A2A08}
.live body{width:100vw;height:100dvh;max-width:500px;margin:0 auto}.live .sb{height:env(safe-area-inset-top,20px);visibility:hidden;padding:0}.live .hb{display:none}.live .scr{height:calc(100dvh - env(safe-area-inset-top,20px))}.live .onb{height:calc(100dvh - env(safe-area-inset-top,20px))}.live .tab{bottom:max(14px,env(safe-area-inset-bottom))}.live .cel{padding-top:calc(60px + env(safe-area-inset-top))}
.hero{background:var(--card)!important;color:var(--ink)!important;box-shadow:var(--sh)!important;border-radius:24px}
.hero .k{color:var(--mut)!important}
.hero .cd{color:var(--mut)!important}.hero .cd big{color:var(--em)!important}
.tl:before{background:var(--line)!important}.tl:after{background:var(--em)!important;opacity:.55}
.tl div{color:var(--mut)!important}.tl div b{color:var(--ink)!important}
.dot{background:var(--card)!important;border:2px solid rgba(122,133,127,.35)!important;color:#fff}
.dot.on{background:var(--em)!important;border-color:var(--em)!important;color:#fff!important}
.dot.late{background:var(--gold)!important;border-color:var(--gold)!important;color:#fff!important}
.dot.nx{border-color:var(--em)!important;box-shadow:0 0 0 5px var(--emL)!important}
.cel{background:radial-gradient(80% 50% at 50% 28%,#FFF6E2 0%,var(--bg) 70%)!important;color:var(--ink)!important}
.dark .cel{background:radial-gradient(80% 50% at 50% 28%,#2A2416 0%,var(--bg) 70%)!important}
.cel p{color:var(--ink2)!important}.cel .num small{color:var(--mut)!important}.cel .src{color:var(--mut)!important}
.cel .ring2{border-color:rgba(184,135,46,.35)!important}.cel .sp{background:var(--gold)!important}
.cel .wk div{color:var(--mut)!important}.cel .wk span{background:var(--card)!important;box-shadow:inset 0 0 0 1px var(--line);color:var(--mut)}
.cel .wk span.d{background:var(--gold)!important;color:#fff!important;box-shadow:none}.cel .wk span.t{background:var(--em)!important;color:#fff!important;box-shadow:0 0 0 5px var(--emL)!important}
.cel .btn{background:var(--em)!important;color:#fff!important}
.cel .hb{background:var(--ink)!important}

const rvGet=()=>{try{return JSON.parse(localStorage.getItem('fq.rv')||'{}')}catch(e){return{}}};
const rv=()=>{const a=rvGet();const n=Object.values(a).filter(v=>v==='y').length;
 return `${sb}<div class="scr"><div class="top"><div><h1>${T('Review','المراجعة')}</h1><div class="sub">${T('Tap View, then ✓ or ✎. Your answers stay on this phone.','اضغط عرض ثم ✓ أو ✎. إجاباتك تبقى على هذا الهاتف.')}</div></div><div class="ring" style="--p:${n/RV.length};width:56px;height:56px"><span style="font-size:14px">${n}/${RV.length}</span></div></div>
 <div class="list">${RV.map((r,i)=>`<div class="li rvi"><span class="rn">${i+1}</span><div class="t"><b>${r[1]}</b><small>${r[2]}</small><div class="rva"><a data-view="${r[0]}">${T('View','عرض')} <i class="ph ph-arrow-up-right"></i></a><a class="ok ${a[i]==='y'?'on':''}" data-rv="${i}" data-v="y"><i class="ph-bold ph-check"></i>${T('Approve','موافقة')}</a><a class="ch ${a[i]==='c'?'on':''}" data-rv="${i}" data-v="c"><i class="ph-bold ph-pencil-simple"></i>${T('Change','تعديل')}</a></div></div></div>`).join('')}</div>

 <div style="height:60px"></div></div><div class="hb"></div>`};

document.getElementById('s').innerHTML=({home,ci,zk,todo,cel,onb,empty,up,cal,stars,game,more,rv})[S]();
if(q.get('from')==='rv'&&S!=='rv'){const b=document.createElement('a');b.className='bk';b.innerHTML='<i class="ph-bold ph-caret-'+(L==='ar'?'right':'left')+'"></i>'+T('Review','المراجعة');b.onclick=()=>go('rv',1);document.body.appendChild(b)}
if(S==='cel'){(function(){
 const R=document.querySelector('.cel'),A=[],st=R.querySelector('.star'),stg=R.querySelector('.stg');
 const an=(el,kf,o)=>{const a=el.animate(kf,Object.assign({fill:'both'},o));A.push(a);return a};
 an(st,[{transform:'scale(0) rotate(-220deg)',opacity:0},{transform:'scale(1.28) rotate(12deg)',opacity:1,offset:.6},{transform:'scale(.93) rotate(-4deg)',offset:.8},{transform:'scale(1) rotate(0)'}],{duration:900,easing:'cubic-bezier(.2,.8,.2,1)'});
 an(R.querySelector('.glow'),[{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1)'}],{duration:700,delay:250,fill:'backwards'});
 an(R.querySelector('.rays'),[{opacity:0},{opacity:1}],{duration:900,delay:400,fill:'backwards'});
 const band=R.querySelector('.star .band');
 const shine=()=>an(band,[{transform:'rotate(20deg) translateX(0)'},{transform:'rotate(20deg) translateX(190px)'}],{duration:800,easing:'ease-in-out',fill:'none'});
 band.style.transformBox='fill-box';band.style.transformOrigin='center';
 setTimeout(shine,850);setInterval(shine,3400);
 const C=['#E2B35A','#F6D58A','#C8901C','#0E5A47','#3FBF93','#EADBC0','#FFF1CC'];
 const burst=(n,delay,pw)=>{for(let i=0;i<n;i++){const e=document.createElement('i');e.className='cf';const w=5+(i%3)*3,h=i%4==0?w:w*1.8;e.style.cssText=`width:${w}px;height:${h}px;margin:-${h/2}px 0 0 -${w/2}px;background:${C[i%C.length]};border-radius:${i%4==0?'50%':'2px'};opacity:0`;stg.insertBefore(e,st);
  const a=(i/n)*6.283+((i*53)%10)/20,v=pw*(.55+((i*37)%45)/100),dx=Math.cos(a)*v,dy=Math.sin(a)*v*.9,rot=((i*97)%720)-360;
  an(e,[{transform:'translate(0,0) rotate(0) scale(.3)',opacity:1},{transform:`translate(${dx*.85}px,${dy*.85-30}px) rotate(${rot*.5}deg) scale(1)`,opacity:1,offset:.35},{transform:`translate(${dx}px,${dy+170}px) rotate(${rot}deg) scale(.9)`,opacity:0}],{duration:1900+(i%5)*160,delay,easing:'cubic-bezier(.15,.75,.35,1)',fill:'forwards'});}};
 burst(54,380,190);burst(22,560,120);
 try{setTimeout(()=>navigator.vibrate&&navigator.vibrate([18,50,30,40,14]),380)}catch(e){}
 const cn=R.querySelector('#cn'),N=13,t0=performance.now()+450;
 if(!q.get('shot')&&q.get('t')===null){cn.textContent='0';const tick=t=>{const k=Math.min(1,Math.max(0,(t-t0)/750));cn.textContent=Math.round(N*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)}
 an(R.querySelector('.num'),[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1.15)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:700,delay:450});
 [...R.querySelectorAll('h2,p,.btn')].forEach((el,i)=>an(el,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:500,delay:700+i*90,easing:'ease-out'}));
 [...R.querySelectorAll('.wk span')].forEach((el,i,l)=>an(el,[{transform:'scale(0)'},{transform:i==l.length-1?'scale(1.35)':'scale(1.15)',offset:.6},{transform:'scale(1)'}],{duration:i==l.length-1?600:380,delay:900+i*80,easing:'cubic-bezier(.3,1.4,.5,1)'}));
 const T0=q.get('t');if(T0!==null||q.get('shot')){const tt=+(T0??1000);A.forEach(a=>{a.pause();a.currentTime=tt});const k=Math.min(1,Math.max(0,(tt-450)/750));cn.textContent=Math.round(N*(1-Math.pow(1-k,3)));cn.dataset.fz=1}
})()}


const go=(s,clr,extra)=>{const u=new URL(location.href);u.searchParams.set('s',s);['d','m','r'].forEach(k=>u.searchParams.delete(k));if(clr||s==='rv')u.searchParams.delete('from');if(extra)for(const k in extra)u.searchParams.set(k,extra[k]);location.href=u.href};
let cnt=1;const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
document.addEventListener('click',e=>{const t=e.target;
 const vw=t.closest('[data-view]');if(vw){vib(8);go(vw.dataset.view,0,{from:'rv'});return}
 const g=t.closest('[data-go]');if(g){vib(8);go(g.dataset.go);return}
 const rb=t.closest('[data-rv]');if(rb){const a=rvGet();const i=rb.dataset.rv;a[i]=a[i]===rb.dataset.v?undefined:rb.dataset.v;localStorage.setItem('fq.rv',JSON.stringify(a));vib(a[i]==='y'?[10,30,14]:8);document.getElementById('s').innerHTML=rv();return}
 const ub=t.closest('[data-up]');if(ub){const a=upGet();const i=ub.dataset.up;a[i]=a[i]==='p'?undefined:'p';localStorage.setItem('fq.up',JSON.stringify(a));vib(a[i]?[10,30,14]:8);const sc=document.querySelector('.scr').scrollTop;document.getElementById('s').innerHTML=up();document.querySelector('.scr').scrollTop=sc;return}
 if(t.closest('[data-copy]')){const a=rvGet();const txt=T('Design review: ','مراجعة التصميم: ')+RV.map((r,i)=>(i+1)+' '+(a[i]==='y'?'✓':a[i]==='c'?'✎':'–')).join(', ')+(()=>{const u=upGet();const k=Object.keys(u).filter(x=>u[x]);return k.length?' | '+T('Upgrades approved: ','ترقيات موافق عليها: ')+k.map(x=>UPR[x].p[1]+' ('+UPR[x].p[3]+')').join(', '):''})();const el=document.getElementById('cpd');const ok=()=>{el.textContent=T('Copied. Paste it in the chat.','تم النسخ. الصقه في المحادثة.')};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,()=>{el.textContent=txt});else el.textContent=txt;vib(10);return}
 const dy=t.closest('[data-day]');if(dy){vib(6);go('ci',0,{d:DOFF+ +dy.dataset.day});return}
 const mo=t.closest('[data-mo]');if(mo){vib(6);go('cal',0,{m:MOFF+ +mo.dataset.mo});return}
 const gd=t.closest('[data-gd]');if(gd){vib(6);go('ci',0,{d:gd.dataset.gd});return}
 if(t.closest('[data-ref]')){vib(6);go('home',0,{r:(ri+1)%REF.length});return}
 const sp=t.closest('.stp');if(sp){const row=sp.closest('.sl');const cur=row.dataset.st;const nx=ORD[(ORD.indexOf(cur)+1)%ORD.length];row.dataset.st=nx;const s=ST[nx];sp.className='st '+s[0]+' stp';sp.textContent=s[1];sp.classList.remove('pop');void sp.offsetWidth;sp.classList.add('pop');const ic=row.querySelector('.ic');ic.className='ic '+(nx==='on'?'e':nx==='late'||nx==='qada'?'g':'');ic.style.cssText=nx==='mark'||nx==='exc'?'background:rgba(118,118,128,.1);color:var(--mut)':'';
  const m=MSG(nx,+row.dataset.i);const box=document.getElementById('msg');box.innerHTML=`<div class="ic ${nx==='on'?'e':nx==='mark'||nx==='exc'?'':'g'}" style="${nx==='mark'||nx==='exc'?'background:rgba(118,118,128,.1);color:var(--mut)':''}"><i class="ph-duotone ${nx==='on'?'ph-seal-check':nx==='late'?'ph-clock':nx==='qada'?'ph-arrow-counter-clockwise':nx==='exc'?'ph-lock-simple':'ph-info'}"></i></div><div><b>${T(P[+row.dataset.i][0],P[+row.dataset.i][1])}: ${m[0]}</b>${m[1]?`<a href="${m[2]}" target="_blank" rel="noopener">${m[1]} · ${T('ṣaḥīḥ','صحيح')}</a>`:''}</div>`;box.classList.remove('on');void box.offsetWidth;box.classList.add('on');vib(nx==='on'?[10,30,14]:8);return}
 const xr=t.closest('.xr');if(xr){const b=xr.querySelector('.xb');const d=!b.classList.contains('on');b.className='st xb '+(d?'on':'no');b.innerHTML=(d?'<i class="ph-bold ph-check"></i>':'')+'+'+(xr.dataset.x==='witr'?5:3)+' '+STAR(12);b.classList.add('pop');vib(d?[10,30,14]:8);return}
 const c=t.closest('.counter');if(c){cnt++;vib(12);c.style.setProperty('--p',Math.min(1,cnt/3));const sp=c.querySelector('span');sp.firstChild.textContent=cnt;c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');if(cnt>=3)setTimeout(()=>go('cel'),650);return}
 const k=t.closest('.li');if(k&&k.querySelector('.ck')){const b=k.querySelector('.ck');const d=!b.classList.contains('d');b.classList.toggle('d',d);b.innerHTML=d?'<i class="ph-bold ph-check"></i>':'';b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');const tt=k.querySelector('.t b');if(tt){tt.style.textDecoration=d?'line-through':'';tt.style.color=d?'var(--mut)':''}vib(d?[10,30,14]:8);return}
 const o=t.closest('.opt');if(o){document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===o));vib(8);return}
 if(t.closest('.cta')||t.closest('.cel .btn')){vib(10);go('home');return}
 if(t.closest('.hero')){go('cel');return}
 if(t.closest('.seg span')){document.querySelectorAll('.seg span').forEach(x=>x.classList.toggle('on',x===t.closest('.seg span')));vib(6);return}
 if(t.closest('.tog span')){t.closest('.tog span').classList.toggle('on');vib(6);return}
});
if(S==='ci'){const r=document.querySelector('.sl[data-i="2"] .stp');if(r&&DOFF===0){const row=r.closest('.sl');row.dataset.st='mark';r.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}
